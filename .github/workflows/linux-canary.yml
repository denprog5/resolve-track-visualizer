name: Linux canary

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching davinci_track_visualizer.__version__
        required: true
        default: 0.1.0
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build private unpublished Linux x64 canary
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/native-build.yml
    with:
      version: ${{ inputs.version }}
      target: linux-x64
      channel: canary
