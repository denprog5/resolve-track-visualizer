name: Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching davinci_track_visualizer.__version__
        required: true
        default: 0.9.0
        type: string
      publish:
        description: Publish a GitHub Release with the signed update manifest
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 release
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/native-build.yml
    with:
      version: ${{ inputs.version }}
      target: windows-x64
      channel: release-candidate

  publish:
    name: Publish GitHub Release
    needs: build
    # Publishing signs update.json, so it runs only from main and only in the protected
    # `release` environment that holds TVIZ_UPDATE_SIGNING_KEY.
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.13"

      - name: Download assembled release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: resolve-track-visualizer-${{ inputs.version }}-release-candidate-windows-x64
          path: release-bundle

      - name: Verify release bundle checksums
        working-directory: release-bundle
        run: sha256sum -c SHA256SUMS

      - name: Write signed update manifest
        env:
          TVIZ_UPDATE_SIGNING_KEY: ${{ secrets.TVIZ_UPDATE_SIGNING_KEY }}
          VERSION: ${{ inputs.version }}
        run: >-
          python scripts/make_update_manifest.py
          --installer "release-bundle/artifacts/TrackVisualizerSetup-${VERSION}-windows-x64.exe"
          --version "$VERSION"
          --out release-bundle/artifacts/update.json

      - name: Extract release notes
        env:
          VERSION: ${{ inputs.version }}
        run: python scripts/release_notes.py --version "$VERSION" --out release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Track Visualizer ${VERSION}" \
            --notes-file release-notes.md \
            "${prerelease[@]}" \
            release-bundle/artifacts/* \
            release-bundle/source/* \
            release-bundle/SHA256SUMS
