name: Native release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching davinci_track_visualizer.__version__
        required: true
        default: 0.1.0
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FFMPEG_VERSION: "9.0.1"
  FFMPEG_SOURCE_URL: https://ffmpeg.org/releases/ffmpeg-9.0.1.tar.xz
  FFMPEG_SOURCE_SHA256: cf38e0e28c7e5605942c4a77755349b0145804a397af37eb1fb4c77cb237f635
  FFMPEG_BUILD_CONFIG: minimal-audio-overlay-nonetwork-r5
  MUTAGEN_VERSION: "1.47.0"
  MUTAGEN_SOURCE_URL: https://files.pythonhosted.org/packages/81/e6/64bc71b74eef4b68e61eb921dcf72dabd9e4ec4af1e11891bbd312ccbb77/mutagen-1.47.0.tar.gz
  MUTAGEN_SOURCE_SHA256: 719fadef0a978c31b4cf3c956261b3c58b6948b32023078a2117b1de09f0fc99
  PYTHON_SOURCE_URL: https://www.python.org/ftp/python/3.12.13/Python-3.12.13.tar.xz
  PYTHON_SOURCE_SHA256: c08bc65a81971c1dd5783182826503369466c7e67374d1646519adf05207b684
  LIBFFI_SOURCE_URL: https://github.com/libffi/libffi/releases/download/v3.4.8/libffi-3.4.8.tar.gz
  LIBFFI_SOURCE_SHA256: bc9842a18898bfacb0ed1252c4febcc7e78fa139fd27fdc7a3e30d9d9356119b
  SYFT_VERSION: "1.42.3"
  SYFT_RELEASE_BASE_URL: https://github.com/anchore/syft/releases/download/v1.42.3
  SYFT_CHECKSUMS_URL: https://github.com/anchore/syft/releases/download/v1.42.3/syft_1.42.3_checksums.txt
  SYFT_CHECKSUMS_SHA256: 3c4a66ddb6e0689fac2be19247064f6053e2a2746035dfbcef8609baa9088f92

jobs:
  prepare:
    name: Validate version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"

      - name: Verify exact Python runtime
        run: python -c "import platform; expected='3.12.13'; actual=platform.python_version(); assert actual == expected, f'Expected Python {expected}, found {actual}'"

      - name: Validate requested version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          match = re.fullmatch(
              r'__version__\s*=\s*["\']([^"\']+)["\']\s*',
              Path("davinci_track_visualizer/__init__.py").read_text(encoding="utf-8").strip(),
          )
          if not match:
              raise SystemExit("Could not read davinci_track_visualizer.__version__")
          source_version = match.group(1)
          if os.environ["EVENT_NAME"] == "push":
              ref = os.environ["REF_NAME"]
              if not ref.startswith("v"):
                  raise SystemExit(f"Release tag must start with v: {ref}")
              requested = ref[1:]
          else:
              requested = os.environ["INPUT_VERSION"].strip()
          version_pattern = r"(?:0|[1-9]\d*)(?:\.(?:0|[1-9]\d*)){2}(?:-[0-9A-Za-z.-]+)?"
          if not re.fullmatch(version_pattern, requested):
              raise SystemExit(f"Version is not supported semantic version syntax: {requested}")
          if requested != source_version:
              raise SystemExit(
                  f"Requested version {requested} does not match source version {source_version}"
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={requested}\n")
          PY

      - name: Download and verify official FFmpeg source
        run: >-
          python packaging/scripts/prepare_dependency_source.py
          --archive build/dependency-source/ffmpeg-9.0.1.tar.xz
          --url "${{ env.FFMPEG_SOURCE_URL }}"
          --sha256 "${{ env.FFMPEG_SOURCE_SHA256 }}"
          --archive-root ffmpeg-9.0.1
          --required-file VERSION
          --download

      - name: Download and verify exact Mutagen corresponding source
        run: >-
          python packaging/scripts/prepare_dependency_source.py
          --archive build/dependency-source/mutagen-1.47.0.tar.gz
          --url "${{ env.MUTAGEN_SOURCE_URL }}"
          --sha256 "${{ env.MUTAGEN_SOURCE_SHA256 }}"
          --archive-root mutagen-1.47.0
          --required-file COPYING
          --download

      - name: Download and verify exact CPython source
        run: >-
          python packaging/scripts/prepare_dependency_source.py
          --archive build/dependency-source/Python-3.12.13.tar.xz
          --url "${{ env.PYTHON_SOURCE_URL }}"
          --sha256 "${{ env.PYTHON_SOURCE_SHA256 }}"
          --archive-root Python-3.12.13
          --required-file LICENSE
          --download

      - name: Download and verify exact libffi source
        run: >-
          python packaging/scripts/prepare_dependency_source.py
          --archive build/dependency-source/libffi-3.4.8.tar.gz
          --url "${{ env.LIBFFI_SOURCE_URL }}"
          --sha256 "${{ env.LIBFFI_SOURCE_SHA256 }}"
          --archive-root libffi-3.4.8
          --required-file LICENSE
          --download

      - name: Upload exact dependency corresponding source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-dependency-sources
          path: |
            build/dependency-source/ffmpeg-9.0.1.tar.xz
            build/dependency-source/mutagen-1.47.0.tar.gz
            build/dependency-source/Python-3.12.13.tar.xz
            build/dependency-source/libffi-3.4.8.tar.gz
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build ${{ matrix.display_name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            display_name: Windows x64
            runner: windows-2025
            python_version: "3.12.10"
            container_image: ""
            executable_suffix: .exe
            runtime_baseline: Windows x64 with Universal CRT
            toolchain_revision: msys2-20260611-gcc-16.1.0-5
            syft_archive: syft_1.42.3_windows_amd64.zip
            syft_sha256: e1b9f4945aa64c2b34970bec617623d7f803d0661b48a50b966768b363322e2d
            syft_member: syft.exe
            sbom_python: python
          - target: linux-x64
            display_name: Linux x64
            runner: ubuntu-24.04
            python_version: "3.12.13"
            container_image: quay.io/pypa/manylinux_2_28_x86_64:2026.05.01-1@sha256:1d3ecb1a3e411f58bc3fd36668d2976db869d64bceaf3486ef2541b0105d2d31
            executable_suffix: ""
            runtime_baseline: glibc 2.28 or later
            toolchain_revision: manylinux-2_28-2026.05.01-1-1d3ecb1a
            syft_archive: syft_1.42.3_linux_amd64.tar.gz
            syft_sha256: 0d6be741479eddd2c8644a288990c04f3df0d609bbc1599a005532a9dff63509
            syft_member: syft
            sbom_python: /opt/python/cp312-cp312/bin/python
          - target: macos-arm64
            display_name: macOS arm64
            runner: macos-15
            python_version: "3.12.10"
            container_image: ""
            executable_suffix: ""
            runtime_baseline: macOS 15 arm64
            toolchain_revision: xcode-16.4-16F6-macos15.5-r1
            syft_archive: syft_1.42.3_darwin_arm64.tar.gz
            syft_sha256: d71ee7db2be0fe2e96f679fd9d69ef04274cc86c8604707797080a21070b3f32
            syft_member: syft
            sbom_python: python
          - target: macos-x64
            display_name: macOS Intel
            runner: macos-15-intel
            python_version: "3.12.10"
            container_image: ""
            executable_suffix: ""
            runtime_baseline: macOS 15 x86_64
            toolchain_revision: xcode-16.4-16F6-macos15.5-r1
            syft_archive: syft_1.42.3_darwin_amd64.tar.gz
            syft_sha256: c00d01b7c43504708c8922d643d1cbaefa62ca8876baa4d2c2cf4c3be43707a9
            syft_member: syft
            sbom_python: python
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container_image }}
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      TVIZ_VERSION: ${{ needs.prepare.outputs.version }}
      TVIZ_TARGET: ${{ matrix.target }}
      TVIZ_PYTHON_VERSION: ${{ matrix.python_version }}
      TVIZ_PYTHON_PREFIX: ${{ github.workspace }}/build/python/${{ matrix.target }}/prefix
      TVIZ_RELEASE_DIR: ${{ github.workspace }}/build/release-output-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
      TVIZ_FFMPEG: ${{ github.workspace }}/build/ffmpeg/${{ matrix.target }}/prefix/bin/ffmpeg${{ matrix.executable_suffix }}
      TVIZ_FFPROBE: ${{ github.workspace }}/build/ffmpeg/${{ matrix.target }}/prefix/bin/ffprobe${{ matrix.executable_suffix }}
      TVIZ_FFMPEG_LICENSE: ${{ github.workspace }}/build/ffmpeg/source/ffmpeg-9.0.1/COPYING.GPLv3
      TVIZ_FFMPEG_VERSION: "9.0.1"
      TVIZ_FFMPEG_SOURCE_URL: https://ffmpeg.org/releases/ffmpeg-9.0.1.tar.xz
      TVIZ_FFMPEG_SOURCE_SHA256: cf38e0e28c7e5605942c4a77755349b0145804a397af37eb1fb4c77cb237f635
      TVIZ_RUNTIME_BASELINE: ${{ matrix.runtime_baseline }}
      SOURCE_DATE_EPOCH: "1704067200"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        if: matrix.target != 'linux-x64'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python_version }}

      - name: Select manylinux Python and verify glibc baseline
        if: matrix.target == 'linux-x64'
        run: |
          test -x /opt/python/cp312-cp312/bin/python
          echo "/opt/python/cp312-cp312/bin" >> "$GITHUB_PATH"
          /opt/python/cp312-cp312/bin/python - <<'PY'
          import ctypes

          libc = ctypes.CDLL("libc.so.6")
          libc.gnu_get_libc_version.restype = ctypes.c_char_p
          version = libc.gnu_get_libc_version().decode("ascii")
          if version != "2.28":
              raise SystemExit(f"Expected the pinned glibc 2.28 build environment, found {version}")
          print(f"glibc {version}")
          PY

      - name: Verify exact Python runtime
        run: python -c "import os, platform; expected=os.environ['TVIZ_PYTHON_VERSION']; actual=platform.python_version(); assert actual == expected, f'Expected Python {expected}, found {actual}'"

      - name: Select and verify pinned macOS toolchain
        if: startsWith(matrix.target, 'macos-')
        run: |
          xcode_path=/Applications/Xcode_16.4.app/Contents/Developer
          test -d "$xcode_path"
          actual=$(DEVELOPER_DIR="$xcode_path" xcodebuild -version)
          expected=$'Xcode 16.4\nBuild version 16F6'
          if [[ "$actual" != "$expected" ]]; then
            printf 'Expected pinned Xcode toolchain:\n%s\nFound:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode_path" >> "$GITHUB_ENV"
          printf '%s\n' "$actual"

      - name: Set up pinned MSYS2 UCRT64 GCC toolchain
        if: matrix.target == 'windows-x64'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0, MSYS2 20260611
        with:
          msystem: UCRT64
          update: false
          install: >-
            diffutils
            make
            mingw-w64-ucrt-x86_64-gcc
          cache: false

      - name: Verify pinned Windows compiler
        if: matrix.target == 'windows-x64'
        shell: msys2 {0}
        run: |
          test "$(pacman -Q mingw-w64-ucrt-x86_64-gcc)" = "mingw-w64-ucrt-x86_64-gcc 16.1.0-5"
          gcc --version

      - name: Download verified dependency source artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-dependency-sources
          path: build/dependency-source

      - name: Restore shared CPython build
        id: python-cache
        if: matrix.target == 'linux-x64'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TVIZ_PYTHON_PREFIX }}
          key: unsigned-cpython-${{ matrix.target }}-${{ env.PYTHON_SOURCE_SHA256 }}-${{ env.LIBFFI_SOURCE_SHA256 }}-${{ hashFiles('packaging/scripts/build_python.sh') }}-${{ matrix.toolchain_revision }}

      - name: Re-verify and extract FFmpeg source
        run: >-
          python packaging/scripts/prepare_dependency_source.py
          --archive build/dependency-source/ffmpeg-9.0.1.tar.xz
          --url "${{ env.FFMPEG_SOURCE_URL }}"
          --sha256 "${{ env.FFMPEG_SOURCE_SHA256 }}"
          --archive-root ffmpeg-9.0.1
          --required-file VERSION
          --extract-to build/ffmpeg/source

      - name: Re-verify and extract CPython source for Linux
        if: matrix.target == 'linux-x64' && steps.python-cache.outputs.cache-hit != 'true'
        run: >-
          python packaging/scripts/prepare_dependency_source.py
          --archive build/dependency-source/Python-3.12.13.tar.xz
          --url "${{ env.PYTHON_SOURCE_URL }}"
          --sha256 "${{ env.PYTHON_SOURCE_SHA256 }}"
          --archive-root Python-3.12.13
          --required-file LICENSE
          --extract-to build/python/source

      - name: Re-verify and extract libffi source for Linux
        if: matrix.target == 'linux-x64' && steps.python-cache.outputs.cache-hit != 'true'
        run: >-
          python packaging/scripts/prepare_dependency_source.py
          --archive build/dependency-source/libffi-3.4.8.tar.gz
          --url "${{ env.LIBFFI_SOURCE_URL }}"
          --sha256 "${{ env.LIBFFI_SOURCE_SHA256 }}"
          --archive-root libffi-3.4.8
          --required-file LICENSE
          --extract-to build/python/source

      - name: Build shared CPython for Linux packaging
        if: matrix.target == 'linux-x64' && steps.python-cache.outputs.cache-hit != 'true'
        run: |
          bash packaging/scripts/build_python.sh \
            build/python/source/Python-3.12.13 \
            build/python/source/libffi-3.4.8 \
            "$TVIZ_PYTHON_PREFIX"

      - name: Select shared CPython for Linux packaging
        if: matrix.target == 'linux-x64'
        run: |
          echo "$TVIZ_PYTHON_PREFIX/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$TVIZ_PYTHON_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Install build dependencies
        if: matrix.target != 'linux-x64'
        run: "python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-release.txt"

      - name: Install build dependencies into shared Linux Python
        if: matrix.target == 'linux-x64'
        run: >-
          /opt/python/cp312-cp312/bin/python -m pip install
          --disable-pip-version-check
          --only-binary=:all:
          --require-hashes
          --target "$TVIZ_PYTHON_PREFIX/lib/python3.12/site-packages"
          -r requirements-release.txt

      - name: Verify shared Linux Python runtime
        if: matrix.target == 'linux-x64'
        run: >-
          python -c "import platform, sysconfig;
          expected='3.12.13'; actual=platform.python_version();
          assert actual == expected, f'Expected Python {expected}, found {actual}';
          assert sysconfig.get_config_var('Py_ENABLE_SHARED') == 1,
          'Linux release Python must provide libpython';
          import ctypes"

      - name: Restore unsigned FFmpeg build
        id: ffmpeg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/ffmpeg/${{ matrix.target }}/prefix
          key: ffmpeg-${{ env.FFMPEG_VERSION }}-${{ env.FFMPEG_SOURCE_SHA256 }}-${{ env.FFMPEG_BUILD_CONFIG }}-${{ matrix.target }}-${{ matrix.toolchain_revision }}-${{ hashFiles('packaging/scripts/build_ffmpeg.sh') }}

      - name: Build FFmpeg natively
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true' && matrix.target != 'windows-x64'
        run: >-
          bash packaging/scripts/build_ffmpeg.sh
          build/ffmpeg/source/ffmpeg-9.0.1
          build/ffmpeg/${{ matrix.target }}/prefix

      - name: Build FFmpeg natively on Windows
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true' && matrix.target == 'windows-x64'
        shell: msys2 {0}
        run: >-
          bash packaging/scripts/build_ffmpeg.sh
          build/ffmpeg/source/ffmpeg-9.0.1
          build/ffmpeg/${{ matrix.target }}/prefix

      - name: Verify cached or freshly built FFmpeg
        if: matrix.target != 'windows-x64'
        run: >-
          bash packaging/scripts/build_ffmpeg.sh
          --verify-prefix
          build/ffmpeg/${{ matrix.target }}/prefix

      - name: Verify cached or freshly built FFmpeg on Windows
        if: matrix.target == 'windows-x64'
        shell: msys2 {0}
        run: >-
          bash packaging/scripts/build_ffmpeg.sh
          --verify-prefix
          build/ffmpeg/${{ matrix.target }}/prefix

      - name: Build native release
        if: matrix.target != 'windows-x64'
        run: |
          python scripts/build_release.py \
            --release-dir "$TVIZ_RELEASE_DIR" \
            --ffmpeg "$TVIZ_FFMPEG" \
            --ffprobe "$TVIZ_FFPROBE" \
            --ffmpeg-license "$TVIZ_FFMPEG_LICENSE" \
            --ffmpeg-version "$TVIZ_FFMPEG_VERSION" \
            --ffmpeg-source-url "$TVIZ_FFMPEG_SOURCE_URL" \
            --ffmpeg-source-sha256 "$TVIZ_FFMPEG_SOURCE_SHA256" \
            --runtime-baseline "$TVIZ_RUNTIME_BASELINE"

      - name: Build native release on Windows
        if: matrix.target == 'windows-x64'
        run: |
          python scripts/build_release.py `
            --release-dir "$env:TVIZ_RELEASE_DIR" `
            --ffmpeg "$env:TVIZ_FFMPEG" `
            --ffprobe "$env:TVIZ_FFPROBE" `
            --ffmpeg-license "$env:TVIZ_FFMPEG_LICENSE" `
            --ffmpeg-version "$env:TVIZ_FFMPEG_VERSION" `
            --ffmpeg-source-url "$env:TVIZ_FFMPEG_SOURCE_URL" `
            --ffmpeg-source-sha256 "$env:TVIZ_FFMPEG_SOURCE_SHA256" `
            --runtime-baseline "$env:TVIZ_RUNTIME_BASELINE"

      - name: Generate SPDX SBOM
        run: >-
          ${{ matrix.sbom_python }} scripts/generate_release_sbom.py
          --archive "${{ runner.temp }}/${{ matrix.syft_archive }}"
          --url "${{ env.SYFT_RELEASE_BASE_URL }}/${{ matrix.syft_archive }}"
          --sha256 "${{ matrix.syft_sha256 }}"
          --checksums "${{ runner.temp }}/syft_1.42.3_checksums.txt"
          --checksums-url "${{ env.SYFT_CHECKSUMS_URL }}"
          --checksums-sha256 "${{ env.SYFT_CHECKSUMS_SHA256 }}"
          --member "${{ matrix.syft_member }}"
          --version "${{ env.SYFT_VERSION }}"
          --scan "${{ env.TVIZ_RELEASE_DIR }}"
          --output "${{ env.TVIZ_RELEASE_DIR }}/resolve-track-visualizer-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.spdx.json"
          --download

      - name: Validate exact release artifact set
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["TVIZ_VERSION"]
          target = os.environ["TVIZ_TARGET"]
          output = Path(os.environ["TVIZ_RELEASE_DIR"])
          portable_suffix = ".zip" if target == "windows-x64" else ".tar.gz"
          setup_suffix = ".exe" if target == "windows-x64" else ""
          expected = {
              f"DavinciTrackVisualizer-{version}-{target}{portable_suffix}",
              f"TrackVisualizerSetup-{version}-{target}{setup_suffix}",
              f"resolve-track-visualizer-{version}-{target}.spdx.json",
          }
          if target != "windows-x64":
              expected.add(f"TrackVisualizerSetup-{version}-{target}.tar.gz")
          entries = list(output.iterdir()) if output.is_dir() else []
          actual = {path.name for path in entries if path.is_file() and not path.is_symlink()}
          invalid = sorted(path.name for path in entries if not path.is_file() or path.is_symlink())
          if invalid or actual != expected:
              raise SystemExit(
                  f"Release artifact set mismatch: expected={sorted(expected)}, "
                  f"actual={sorted(actual)}, invalid={invalid}"
              )
          print("\n".join(str(output / name) for name in sorted(actual)))
          PY

      - name: Upload target artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: ${{ env.TVIZ_RELEASE_DIR }}/*
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

  attest:
    name: Attest release artifacts
    needs:
      - prepare
      - assemble
    if: github.repository_visibility == 'public' || vars.ENABLE_PRIVATE_ATTESTATIONS == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download assembled release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: resolve-track-visualizer-${{ needs.prepare.outputs.version }}-release
          path: release-assets

      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/**/*

  assemble:
    name: Checksums and release bundle
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"

      - name: Verify exact Python runtime
        run: python -c "import platform; expected='3.12.13'; actual=platform.python_version(); assert actual == expected, f'Expected Python {expected}, found {actual}'"

      - name: Download target artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: artifacts

      - name: Download dependency corresponding sources
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-dependency-sources
          path: artifacts/source

      - name: Generate SHA-256 checksums
        run: |
          python - <<'PY'
          import hashlib
          from collections import Counter
          from pathlib import Path

          files = sorted(path for path in Path("artifacts").rglob("*") if path.is_file())
          if not files:
              raise SystemExit("No release artifacts were downloaded")
          duplicates = sorted(
              name for name, count in Counter(path.name for path in files).items() if count > 1
          )
          if duplicates:
              raise SystemExit(f"Release asset filenames must be unique: {duplicates}")
          lines = []
          for path in files:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest}  {path.name}")
          Path("SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="ascii")
          print("\n".join(lines))
          PY

      - name: Upload assembled release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resolve-track-visualizer-${{ needs.prepare.outputs.version }}-release
          path: |
            artifacts/**/*
            SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  release-gate:
    name: Gate release publication
    needs:
      - prepare
      - assemble
      - attest
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Require build assembly and configured attestations
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          ASSEMBLE_RESULT: ${{ needs.assemble.result }}
          ATTEST_RESULT: ${{ needs.attest.result }}
          REPOSITORY_VISIBILITY: ${{ github.repository_visibility }}
          ENABLE_PRIVATE_ATTESTATIONS: ${{ vars.ENABLE_PRIVATE_ATTESTATIONS }}
        run: |
          if [[ "$PREPARE_RESULT" != success || "$ASSEMBLE_RESULT" != success ]]; then
            echo "Release prerequisites failed: prepare=$PREPARE_RESULT assemble=$ASSEMBLE_RESULT" >&2
            exit 1
          fi
          if [[ "$REPOSITORY_VISIBILITY" == public || "$ENABLE_PRIVATE_ATTESTATIONS" == true ]]; then
            if [[ "$ATTEST_RESULT" != success ]]; then
              echo "Required artifact attestation did not succeed: $ATTEST_RESULT" >&2
              exit 1
            fi
          elif [[ "$ATTEST_RESULT" != skipped ]]; then
            echo "Private-repository attestation must be intentionally skipped, found: $ATTEST_RESULT" >&2
            exit 1
          fi

  publish:
    name: Publish GitHub prerelease
    needs:
      - prepare
      - assemble
      - release-gate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.release-gate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"

      - name: Verify exact Python runtime
        run: python -c "import platform; expected='3.12.13'; actual=platform.python_version(); assert actual == expected, f'Expected Python {expected}, found {actual}'"

      - name: Download assembled release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: resolve-track-visualizer-${{ needs.prepare.outputs.version }}-release
          path: release-assets

      - name: Fail closed if a release already exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > existing-releases.json
          python - <<'PY'
          import json
          import os

          pages = json.load(open("existing-releases.json", encoding="utf-8"))
          releases = [release for page in pages for release in (page if isinstance(page, list) else [page])]
          matches = [release for release in releases if release.get("tag_name") == os.environ["RELEASE_TAG"]]
          if matches:
              raise SystemExit(f"Refusing to modify existing release for {os.environ['RELEASE_TAG']}")
          PY

      - name: Create unpublished prerelease draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          --verify-tag
          --draft
          --prerelease
          --generate-notes
          --title "Resolve Track Visualizer v${{ needs.prepare.outputs.version }}"

      - name: Upload complete draft asset set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find release-assets/artifacts -type f -print0)
          assets+=(release-assets/SHA256SUMS)
          if [[ ${#assets[@]} -lt 2 ]]; then
            echo "No release assets were assembled" >&2
            exit 1
          fi
          gh release upload "${{ github.ref_name }}" "${assets[@]}"

      - name: Validate exact remote draft asset names
        id: remote-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" --json assets,databaseId,isDraft,isPrerelease,tagName > remote-release.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected_paths = [path for path in Path("release-assets/artifacts").rglob("*") if path.is_file()]
          expected_paths.append(Path("release-assets/SHA256SUMS"))
          expected = sorted(path.name for path in expected_paths)
          if len(expected) != len(set(expected)):
              raise SystemExit(f"Local release asset names are not unique: {expected}")
          release = json.load(open("remote-release.json", encoding="utf-8"))
          actual = sorted(asset["name"] for asset in release.get("assets", []))
          if release.get("tagName") != os.environ["RELEASE_TAG"]:
              raise SystemExit(f"Remote release tag mismatch: {release.get('tagName')}")
          if release.get("isDraft") is not True or release.get("isPrerelease") is not True:
              raise SystemExit("Release must remain an unpublished prerelease draft during validation")
          if actual != expected:
              raise SystemExit(f"Remote release asset mismatch: expected={expected}, actual={actual}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"release_id={release['databaseId']}\n")
          PY

      - name: Publish validated prerelease draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.remote-release.outputs.release_id }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -F prerelease=true \
            --silent
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,tagName > published-release.json
          python - <<'PY'
          import json
          import os

          release = json.load(open("published-release.json", encoding="utf-8"))
          if release.get("tagName") != os.environ["RELEASE_TAG"]:
              raise SystemExit("Published release tag changed unexpectedly")
          if release.get("isDraft") is not False or release.get("isPrerelease") is not True:
              raise SystemExit(f"Release publication state is invalid: {release}")
          PY
