name: Windows release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching davinci_track_visualizer.__version__
        required: true
        default: 0.1.0
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build private Windows x64 release candidate
    permissions:
      contents: read
    uses: ./.github/workflows/native-build.yml
    with:
      version: ${{ inputs.version }}
      target: windows-x64
      channel: release-candidate
