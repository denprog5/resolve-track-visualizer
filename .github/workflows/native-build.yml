          }

      - name: Re-query live repository visibility before Windows target upload
        if: inputs.target == 'windows-x64'
        env:
          CHANNEL: ${{ inputs.channel }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          @'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/{os.environ['GITHUB_REPOSITORY']}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              repository = json.load(response)
          allowed = {"private", "public"} if os.environ["CHANNEL"] == "release-candidate" else {"private"}
          if repository.get("visibility") not in allowed:
              raise SystemExit(
