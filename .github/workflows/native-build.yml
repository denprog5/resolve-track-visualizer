      - name: Upload internal Windows target transfer artifact
        if: inputs.target == 'windows-x64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: internal-native-transfer-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.target }}
          path: ${{ env.TVIZ_RELEASE_DIR }}/*
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

      - name: Re-query live repository visibility before Linux target upload
        if: inputs.target == 'linux-x64'
        env:
          CHANNEL: ${{ inputs.channel }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          /opt/python/cp312-cp312/bin/python - <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/{os.environ['GITHUB_REPOSITORY']}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              repository = json.load(response)
          allowed = {"private", "public"} if os.environ["CHANNEL"] == "release-candidate" else {"private"}
          if repository.get("visibility") not in allowed:
              raise SystemExit(
                  f"Refusing {os.environ['CHANNEL']} artifact upload: live visibility is {repository.get('visibility')!r}"
              )
          print(f"Live repository visibility is {repository.get('visibility')}")
          PY

      - name: Upload internal Linux target transfer artifact
        if: inputs.target == 'linux-x64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: internal-native-transfer-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.target }}
          path: ${{ env.TVIZ_RELEASE_DIR }}/*
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

  assemble:
    name: Checksums and release bundle
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read

    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"

      - name: Verify exact Python runtime
        run: python -c "import platform; expected='3.12.13'; actual=platform.python_version(); assert actual == expected, f'Expected Python {expected}, found {actual}'"

      - name: Download internal target transfer artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: internal-native-transfer-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.target }}
          path: internal-target

      - name: Download dependency corresponding sources
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: internal-native-sources-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.target }}
          path: release-bundle/source

      - name: Verify internal dependency source transfer checksums
        run: |
          python - <<'PY'
          import hashlib
          import re
          from pathlib import Path, PurePosixPath

          source_root = Path("release-bundle/source")
          manifest = source_root / "INTERNAL_SHA256SUMS"
          if manifest.is_symlink() or not manifest.is_file():
              raise SystemExit(f"Internal source checksum manifest is missing: {manifest}")

          records = {}
          for line in manifest.read_text(encoding="ascii").splitlines():
              match = re.fullmatch(r"([0-9a-f]{64})  (.+)", line)
              if match is None:
                  raise SystemExit(f"Invalid internal source checksum record: {line!r}")
              digest, name = match.groups()
              relative = PurePosixPath(name)
              if (
                  relative.is_absolute()
                  or len(relative.parts) != 1
                  or relative.name == manifest.name
                  or name in records
              ):
                  raise SystemExit(f"Unsafe internal source checksum path: {name!r}")
              records[name] = digest
          if not records:
              raise SystemExit("Internal source checksum manifest is empty")

          entries = list(source_root.iterdir()) if source_root.is_dir() else []
          invalid = sorted(
              path.name for path in entries if path.is_symlink() or not path.is_file()
          )
          actual = {path.name for path in entries if path.name != manifest.name}
          if invalid or actual != set(records):
              raise SystemExit(
                  f"Internal source transfer set mismatch: expected={sorted(records)}, "
                  f"actual={sorted(actual)}, invalid={invalid}"
              )

          for name, expected_digest in sorted(records.items()):
              digest = hashlib.sha256()
              with (source_root / name).open("rb") as handle:
                  while chunk := handle.read(1024 * 1024):
                      digest.update(chunk)
              actual_digest = digest.hexdigest()
              if actual_digest != expected_digest:
                  raise SystemExit(
                      f"Internal source checksum mismatch for {name}: "
                      f"expected {expected_digest}, found {actual_digest}"
                  )
          print("Verified internal dependency source transfer")
          PY

      - name: Verify internal transfer checksums and assemble target artifacts
        run: |
          python - <<'PY'
          import hashlib
          import re
          import shutil
          from pathlib import Path, PurePosixPath

          transfer = Path("internal-target")
          manifest = transfer / "INTERNAL_SHA256SUMS"
          if manifest.is_symlink() or not manifest.is_file():
              raise SystemExit(f"Internal transfer checksum manifest is missing: {manifest}")

          records = {}
          for line in manifest.read_text(encoding="ascii").splitlines():
              match = re.fullmatch(r"([0-9a-f]{64})  (.+)", line)
              if match is None:
                  raise SystemExit(f"Invalid internal checksum record: {line!r}")
              digest, name = match.groups()
              relative = PurePosixPath(name)
              if (
                  relative.is_absolute()
                  or len(relative.parts) != 1
                  or relative.name == manifest.name
                  or name in records
              ):
                  raise SystemExit(f"Unsafe internal checksum path: {name!r}")
              records[name] = digest
          if not records:
              raise SystemExit("Internal transfer checksum manifest is empty")

          entries = list(transfer.iterdir()) if transfer.is_dir() else []
          invalid = sorted(
              path.name for path in entries if path.is_symlink() or not path.is_file()
          )
          actual = {path.name for path in entries if path.name != manifest.name}
          if invalid or actual != set(records):
              raise SystemExit(
                  f"Internal transfer set mismatch: expected={sorted(records)}, "
                  f"actual={sorted(actual)}, invalid={invalid}"
              )

          destination = Path("release-bundle/artifacts")
          destination.mkdir(parents=True)
          for name, expected_digest in sorted(records.items()):
              source = transfer / name
              digest = hashlib.sha256()
              with source.open("rb") as handle:
                  while chunk := handle.read(1024 * 1024):
                      digest.update(chunk)
              actual_digest = digest.hexdigest()
              if actual_digest != expected_digest:
                  raise SystemExit(
                      f"Internal transfer checksum mismatch for {name}: "
                      f"expected {expected_digest}, found {actual_digest}"
                  )
              shutil.copyfile(source, destination / name)
          print("Verified and assembled internal target transfer")
          PY

      - name: Generate final bundle SHA-256 checksums
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          bundle = Path("release-bundle")
          artifacts = bundle / "artifacts"
          sources = bundle / "source"
          for directory in (artifacts, sources):
              if directory.is_symlink() or not directory.is_dir():
                  raise SystemExit(f"Final bundle directory is missing: {directory}")
              if not any(directory.iterdir()):
                  raise SystemExit(f"Final bundle directory is empty: {directory}")

          manifest = bundle / "SHA256SUMS"
          if manifest.exists() or manifest.is_symlink():
              raise SystemExit(f"Refusing to replace existing final checksum manifest: {manifest}")
          entries = list(bundle.rglob("*"))
          invalid = sorted(
              path.relative_to(bundle).as_posix()
              for path in entries
              if path.is_symlink() or not (path.is_file() or path.is_dir())
          )
          if invalid:
              raise SystemExit(f"Invalid final bundle entries: {invalid}")
          files = sorted(
              (path for path in entries if path.is_file()),
              key=lambda path: path.relative_to(bundle).as_posix(),
          )
          lines = []
          for path in files:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  while chunk := handle.read(1024 * 1024):
                      digest.update(chunk)
              relative = path.relative_to(bundle).as_posix()
              lines.append(f"{digest.hexdigest()}  {relative}")
          manifest.write_text("\n".join(lines) + "\n", encoding="ascii")
          print("\n".join(lines))
          PY

      - name: Verify final bundle SHA-256 checksums
        working-directory: release-bundle
        run: sha256sum -c SHA256SUMS

      - name: Re-query live repository visibility before assembled bundle upload
        env:
          CHANNEL: ${{ inputs.channel }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/{os.environ['GITHUB_REPOSITORY']}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              repository = json.load(response)
          allowed = {"private", "public"} if os.environ["CHANNEL"] == "release-candidate" else {"private"}
          if repository.get("visibility") not in allowed:
              raise SystemExit(
                  f"Refusing {os.environ['CHANNEL']} artifact upload: live visibility is {repository.get('visibility')!r}"
              )
          print(f"Live repository visibility is {repository.get('visibility')}")
          PY

      - name: Upload assembled release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resolve-track-visualizer-${{ needs.prepare.outputs.version }}-${{ inputs.channel }}-${{ inputs.target }}
          path: release-bundle
          if-no-files-found: error
          retention-days: 1

      - name: Delete internal transfer artifacts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          INTERNAL_SOURCE_ARTIFACT: internal-native-sources-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.target }}
          INTERNAL_TARGET_ARTIFACT: internal-native-transfer-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.target }}
        run: |
          artifact_ids=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name == env.INTERNAL_SOURCE_ARTIFACT or .name == env.INTERNAL_TARGET_ARTIFACT) | .id")
          while read -r artifact_id; do
            if [[ -n "$artifact_id" ]]; then
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" \
                --silent
            fi
          done <<< "$artifact_ids"
