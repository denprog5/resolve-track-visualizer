      - name: Validate exact release artifact set on Linux
        if: inputs.target == 'linux-x64'
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          version = os.environ["TVIZ_VERSION"]
          target = os.environ["TVIZ_TARGET"]
          output = Path(os.environ["TVIZ_RELEASE_DIR"])
          portable_suffix = ".zip" if target == "windows-x64" else ".tar.gz"
          setup_suffix = ".exe" if target == "windows-x64" else ""
          expected = {
              f"DavinciTrackVisualizer-{version}-{target}{portable_suffix}",
              f"TrackVisualizerSetup-{version}-{target}{setup_suffix}",
              f"resolve-track-visualizer-{version}-{target}.spdx.json",
          }
          if target != "windows-x64":
              expected.add(f"TrackVisualizerSetup-{version}-{target}.tar.gz")
          entries = list(output.iterdir()) if output.is_dir() else []
          actual = {path.name for path in entries if path.is_file() and not path.is_symlink()}
          invalid = sorted(path.name for path in entries if not path.is_file() or path.is_symlink())
          if invalid or actual != expected:
              raise SystemExit(
                  f"Release artifact set mismatch: expected={sorted(expected)}, "
                  f"actual={sorted(actual)}, invalid={invalid}"
              )
          checksums = []
          for name in sorted(actual):
              digest = hashlib.sha256()
              with (output / name).open("rb") as handle:
                  while chunk := handle.read(1024 * 1024):
                      digest.update(chunk)
              checksums.append(f"{digest.hexdigest()}  {name}")
          manifest = output / "INTERNAL_SHA256SUMS"
          manifest.write_text("\n".join(checksums) + "\n", encoding="ascii")
          print("\n".join(str(output / name) for name in sorted(actual | {manifest.name})))
          PY

      - name: Validate exact release artifact set on Windows
        if: inputs.target == 'windows-x64'
        shell: pwsh
        run: |
          @'
